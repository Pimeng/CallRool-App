name: Test APK

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build test APK
        run: flutter build apk --release --target-platform android-arm64
        env:
          ORG_GRADLE_PROJECT_testPackage: "true"

      - name: Verify test package name
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk \
            | grep -F "package: name='wtf.pimeng.callrool.test'"

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk CallRool-dark-mode-test.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: CallRool-dark-mode-test
          path: CallRool-dark-mode-test.apk
          if-no-files-found: error
          retention-days: 14
